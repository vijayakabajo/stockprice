[tool.black]
line-length = 110
target-version = ["py313"]
extend-exclude = '''
/(
  migrations
)/
'''

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# settings.py re-exports each config/*.py symbol as a module-level setting —
# that assignment *is* the usage, imports must stay interleaved with the
# sections that consume them, so E402/F401 don't apply here.
"app/settings.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "data_provider", "market", "sync", "web"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.settings"
testpaths = ["tests"]
# Every model is managed = False: tests/conftest.py builds the test database
# from sql/ with apply_sql, since Django creates no tables for them.
