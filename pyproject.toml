[tool.black]
line-length = 110
target-version = ["py313"]
extend-exclude = '''
/(
  migrations
)/
'''

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# settings.py re-exports each config/*.py symbol as a module-level setting —
# that assignment *is* the usage, imports must stay interleaved with the
# sections that consume them, so E402/F401 don't apply here.
"app/settings.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "accounts", "market"]

# No test config: tests are deliberately out of scope for now. Adding them back
# means reinstating pytest/pytest-django in requirements/dev.txt, a
# [tool.pytest.ini_options] block here, and a conftest.py that runs
# `apply_sql` against the test database — every model is managed = False, so
# without that step the test database has no tables at all. See SCHEMA_PLAN.md.
