# Render Blueprint, free tier: the web site + API, Postgres and Key Value
# (Redis). Step-by-step instructions are in DEPLOY.md.
#
# The free tier has no background workers and no pre-deploy command, so:
#   - the schema is applied in the start command, on every boot;
#   - there is no Celery worker; syncs run by hand from a laptop against
#     the database and Redis below, which is why both accept external
#     connections (password-protected).
# DEPLOY.md ("Moving to paid") lists what to change for production.

services:
  - type: web
    name: stockprices-web
    runtime: python
    plan: free
    region: oregon
    branch: master
    buildCommand: pip install -r requirements/prod.txt && python manage.py collectstatic --noinput
    # Django's own tables (admin, auth, sessions), then our schema from sql/.
    # Both are no-ops when nothing is pending.
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py apply_sql &&
      gunicorn app.wsgi:application --workers 2 --timeout 60 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.12"
      - key: ENV_TYPE
        value: production
      - key: DEBUG
        value: "False"
      - key: PROJECT_NAME
        value: shockprices
      - key: SITE_NAME
        value: Equity Profiles
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stockprices-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stockprices-redis
          property: connectionString
      # Asked for when the Blueprint is created.
      - key: MASSIVE_API_KEY
        sync: false
      - key: SITE_URL # https://stockprices-web.onrender.com or your domain, no trailing slash
        sync: false

  - type: keyvalue
    name: stockprices-redis
    plan: free
    region: oregon
    # Open to external connections so syncs run from a laptop can reach it
    # (they bump the cache version the site reads). Requires the password.
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere (password required)
    # Evict only keys with a TTL (cached responses), never the data-version
    # key, which has none.
    maxmemoryPolicy: volatile-lru

databases:
  - name: stockprices-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: shockprices_db
    user: shockprices
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere (password required)
