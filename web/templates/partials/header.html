{% load static %}<header class="site-header">
  <div class="site-header__in">
    <a class="brand" href="{% url 'web:home' %}">
      <span class="brand__tile" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M2 11.5l3-3 2.5 2L11 6l3 3" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="6" r="1.5" fill="#fff"/></svg></span>
      <span class="brand__name">{{ site.name }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul>{% for item in nav %}
        <li><a href="{{ item.href }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.label }}</a></li>{% endfor %}
      </ul>
    </nav>
    <form class="site-search" action="{% url 'web:search' %}" method="get" role="search" data-search>
      <label class="visually-hidden" for="site-q">Search stocks</label>
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="site-q" name="q" type="search" placeholder="Ticker or company" autocomplete="off" spellcheck="false" enterkeyhint="search">
    </form>
    <button class="theme-toggle" type="button" data-theme-toggle hidden aria-label="Switch between light and dark theme">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
    </button>
  </div>
</header>
